name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed -l 120 lib test
      - run: flutter analyze
      - run: flutter test
      # Assina com a chave de produção só se os segredos existirem (veja docs/PUBLICAR.md).
      # Sem a chave de produção, o APK é assinado com a chave de debug. Guardá-la no cache faz todos os
      # APKs de teste terem a mesma assinatura, e o celular aceita atualizar sem desinstalar.
      - name: Mesma chave de debug em todos os builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chave-debug-encaixa-v1
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/encaixa.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/encaixa.jks" >> "$GITHUB_ENV"
      - name: Gerar APK e AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          DEFINES="--dart-define=ADMOB_PREMIADO=${{ secrets.ADMOB_PREMIADO }} --dart-define=ADMOB_INTERSTICIAL=${{ secrets.ADMOB_INTERSTICIAL }}"
          # Sem os segredos, os IDs ficam vazios e o app usa os de teste.
          [ -z "${{ secrets.ADMOB_PREMIADO }}" ] && DEFINES=""
          flutter build apk --release $DEFINES
          flutter build appbundle --release $DEFINES
      # O SDK de anúncios fecha o app na abertura se o ID do AdMob estiver vazio no manifesto.
      - name: Conferir ID do AdMob no APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml build/app/outputs/flutter-apk/app-release.apk \
            | grep -A2 'com.google.android.gms.ads.APPLICATION_ID' | tee /dev/stderr | grep -q 'ca-app-pub-'
      - uses: actions/upload-artifact@v4
        with:
          name: encaixa-android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

  # Abre o APK de verdade num emulador Android: pega o app que fecha ao abrir.
  emulador:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: encaixa-android
          path: apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./ferramentas/testar_no_emulador.sh "$(find apk -name app-release.apk | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador
          path: emulador/
